<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotina · Bia &amp; Davi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f4;--card:#fffdfb;--tx:#2b2630;--mut:#8a8294;--bd:#eee8e6;--ok:#9ccbb0;--okbg:#e8f2ec;--bad:#d98a8a;--ink:#2f2a36;--serif:"Fraunces",Georgia,"Times New Roman",serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161b;--card:#201f26;--tx:#f1edf3;--mut:#9a93a6;--bd:#2f2d38;--okbg:#25322b;color-scheme:dark}
:root:not([data-theme="light"]) .p-bia{--acd:#f0a8bb}:root:not([data-theme="light"]) .p-davi{--acd:#9db8ea}}
:root[data-theme="dark"]{--bg:#17161b;--card:#201f26;--tx:#f1edf3;--mut:#9a93a6;--bd:#2f2d38;--okbg:#25322b;color-scheme:dark}
:root[data-theme="dark"] .p-bia{--acd:#f0a8bb}:root[data-theme="dark"] .p-davi{--acd:#9db8ea}
.p-bia{--ac:#f3c6d1;--ac2:#f8dfcf;--acd:#b4546e}
.p-davi{--ac:#c9d9f2;--ac2:#dcd3f0;--acd:#4f6fa8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:16px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(700px 380px at 92% -60px,color-mix(in srgb,#f3c6d1 40%,transparent),transparent),radial-gradient(600px 420px at -10% 45%,color-mix(in srgb,#c9d9f2 35%,transparent),transparent),var(--bg);background-repeat:no-repeat}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px)}
.app{max-width:640px;margin:0 auto;padding:16px 14px 70px}
h2{font-family:var(--serif);font-weight:600;font-size:18px;margin:0 0 10px;letter-spacing:-.2px}
.hero{position:relative;overflow:hidden;margin:6px 0 16px;padding:28px 22px 20px;border-radius:30px;color:var(--ink);background:linear-gradient(135deg,var(--ac),var(--ac2))}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:210px;height:210px;border-radius:50%;background:#ffffff55}
.hero::before{content:"";position:absolute;right:40px;bottom:-70px;width:150px;height:150px;border-radius:50%;background:#ffffff33}
.hero .dd{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.hero h1{font-family:var(--serif);font-weight:500;font-size:38px;line-height:1.1;margin:6px 0 6px;letter-spacing:-1px}
.hero p{margin:0 0 16px;opacity:.75}
.pill{display:inline-block;position:relative;z-index:1;background:#ffffff8c;border-radius:99px;padding:6px 13px;font-size:13px;font-weight:500;margin:0 6px 6px 0}
.bar2{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 -14px 6px;padding:10px 14px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:4px;gap:4px;margin:0 0 8px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:10px 6px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;transition:background .25s,color .25s}
.seg button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .25s}
.chips button.on{color:var(--ink);border-color:transparent;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.sec{margin:34px 0 8px;scroll-margin-top:130px}
.sec-h{display:flex;align-items:baseline;gap:12px;position:relative;padding-bottom:12px;margin-bottom:14px}
.sec-h::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;border-radius:3px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.sec.in .sec-h::after{width:100%}
.num{font-family:var(--serif);font-size:15px;color:var(--acd)}
.sec-t{font-family:var(--serif);font-size:28px;font-weight:500;letter-spacing:-.6px}
.sec-b{clip-path:inset(-30px 100% -30px -30px);opacity:0;transform:translateX(-28px);transition:clip-path 1s cubic-bezier(.2,.8,.2,1) .2s,opacity .7s .2s,transform 1s cubic-bezier(.2,.8,.2,1) .2s}
.sec.in .sec-b{clip-path:inset(-30px -30px -30px -30px);opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.sec-b,.sec-h::after{transition:none}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:0 22px 40px -32px rgba(80,60,90,.4)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px 14px;margin-bottom:8px;color:var(--tx);font:inherit;cursor:pointer;transition:transform .15s,border-color .2s,background .2s}
.row:active{transform:scale(.985)}
.row .ck{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bd);flex:none;display:grid;place-items:center;color:var(--ink);font-size:14px}
.row.on{background:var(--okbg);border-color:var(--ok)}.row.on .ck{background:var(--ok);border-color:var(--ok)}
.row small{display:block;color:var(--mut);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.row.on b{opacity:.65;text-decoration:line-through}
input,select{font:inherit;color:var(--tx);background:color-mix(in srgb,var(--bg) 70%,var(--card));border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:0}
input:focus,select:focus{outline:2px solid var(--acd);outline-offset:1px}
button.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;color:var(--ink);background:linear-gradient(135deg,var(--ac),var(--ac2))}
button.btn.ghost{background:none;color:var(--acd);border:1px solid var(--acd)}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.f>*{flex:1 1 120px}
.f label{display:block}.f label input{width:100%;margin-top:4px}
.nav{display:flex;gap:6px;align-items:center;margin-bottom:12px}.nav input{flex:1}.nav button{padding:10px 14px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--ac),var(--acd));transition:width .6s}
.mut{color:var(--mut);font-size:13px}.x{background:none;border:0;color:var(--bad);font-size:17px;cursor:pointer;padding:4px 8px}
.strip{display:flex;gap:4px;margin:6px 0 14px}.strip button{flex:1;height:28px;border:1px solid var(--bd);border-radius:8px;background:var(--card);cursor:pointer;padding:0;position:relative;overflow:hidden}
.strip button i{position:absolute;inset:auto 0 0 0;background:var(--ok)}.strip button.cur{outline:2px solid var(--acd)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font:500 12px "Inter",sans-serif;background:var(--bd);color:var(--mut);vertical-align:middle}
.badge.ok{background:#d5e9dc;color:#2e6a4a}.badge.bad{background:#f6d5d5;color:#8a3a3a}
.ms{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd)}.ms:last-of-type{border:0}.ms.on{color:#4e9170;font-weight:600}
.rec{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.rec:last-child{border:0}
.rec img{width:64px;height:84px;object-fit:cover;border-radius:14px;cursor:zoom-in;background:var(--bd)}.rec div{flex:1}
.warn{background:#fbf0d4;color:#6b5320;padding:10px 12px;border-radius:14px;margin:10px 0;font-size:14px}
.row.trn.on b{text-decoration:none;opacity:1}
.x.cf{background:var(--bad);color:#fff;border-radius:10px;font-size:13px;font-weight:600}
.st{font-size:12px;color:var(--mut);margin-top:6px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto;background:#2f2a36;color:#fff;padding:12px 14px;border-radius:14px;z-index:30;font-size:14px;opacity:0;transform:translateY(20px);pointer-events:none;transition:.3s}#toast.on{opacity:1;transform:none}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:20}#lb.on{display:grid}#lb img{max-width:94%;max-height:90%;border-radius:16px}
</style></head><body>
<div id="root"></div><div id="lb" data-a="unzoom"><img alt=""></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const TODAY=iso(new Date());
const add=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const br=s=>s.split('-').reverse().join('/');
const kg=n=>Number(n).toLocaleString('pt-BR',{maximumFractionDigits:1});
const uid=()=>Math.random().toString(36).slice(2,9);
const pu=p=>p&&p.startsWith('data:')?p:'/_blob/'+p;
const TYPES=['Café da manhã','Lanche da manhã','Almoço','Lanche da tarde','Pré-treino','Jantar','Ceia'];
const NAMES={bia:'Bia',davi:'Davi'};
const blank=()=>({meals:[],mealLog:{},workouts:[],workLog:{},weights:[],goal:{start:null,lose:null,step:2,deadline:'2027-02-03'}});
let S={bia:blank(),davi:blank()},P='bia',D=TODAY,db=null,assets=null,msg='',EDIT=false,LOCAL=false;
let ST='loading',READY=false,dirty=false,CONF=null,ct,RP=null,FLY={bia:false,davi:false},VER={bia:0,davi:0},LOADED={bia:false,davi:false},DENIED={bia:false,davi:false};
const MUT=new Set(['meal','trained','ex','allex','addw','delw','addex','delex','addm','delm','delwt','addwt','savegoal']);
const LABEL={loading:'Conectando…',saved:'● Salvo na nuvem',saving:'Salvando…',denied:'● Só neste aparelho (sem permissão na nuvem)',local:'● Só neste aparelho'};
function setSt(v){ST=v;const e=$('#st');if(e)e.textContent=LABEL[v]}
let tt;function toast(t){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=t;e.className='on';clearTimeout(tt);tt=setTimeout(()=>e.className='',6000)}
function ask(key){if(CONF===key){CONF=null;return true}CONF=key;clearTimeout(ct);ct=setTimeout(()=>{CONF=null;render()},4000);render();return false}
function lsGet(k){try{return JSON.parse(localStorage.getItem('rotina:'+k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem('rotina:'+k,JSON.stringify(v))}catch(e){}}

function save(){
  const k=P;S[k].t=Date.now();VER[k]++;lsSet(k,S[k]);render();
  if(!db)return setSt('local');
  if(DENIED[k])return setSt('denied');
  flush(k);
}
async function flush(k){if(FLY[k])return;FLY[k]=true;setSt('saving');let v;try{do{v=VER[k];await db.doc('people/'+k).set(S[k])}while(v!==VER[k]);setSt('saved')}catch(e){DENIED[k]=true;setSt('denied');toast('Não foi possível salvar na nuvem ('+((e&&(e.message||e.code))||'erro')+'). Seus registros ficam só neste aparelho. Peça permissão de edição ou colaboração no link.')}finally{FLY[k]=false}
}
const cur=()=>S[P];

/* modo local (ex.: GitHub Pages): salva só neste aparelho */
function shim(){
  assets={upload:f=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({id:c.toDataURL('image/jpeg',.7)})};im.onerror=rej;im.src=URL.createObjectURL(f)})}}

/* ---------- Alimentação ---------- */
function dateNav(){return `<div class="nav"><button class="btn ghost" data-a="day" data-n="-1">‹</button><input type="date" class="dt" value="${D}"><button class="btn ghost" data-a="day" data-n="1">›</button><button class="btn" data-a="today">Hoje</button></div>`}
function alim(){
  const d=cur(),log=d.mealLog[D]||{};
  const meals=[...d.meals].sort((a,b)=>TYPES.indexOf(a.type)-TYPES.indexOf(b.type));
  const n=meals.filter(m=>log[m.id]).length,pct=meals.length?Math.round(n/meals.length*100):0,ed=EDIT||!meals.length;
  let strip='';
  for(let i=13;i>=0;i--){const s=add(TODAY,-i),l=d.mealLog[s]||{},t=d.meals.length,c=d.meals.filter(m=>l[m.id]).length;
    strip+=`<button class="${s===D?'cur':''}" title="${br(s)}" data-a="goto" data-d="${s}"><i style="height:${t?c/t*100:0}%"></i></button>`}
  let h=dateNav()+`<div class="card"><h2>Refeições · ${n}/${meals.length}</h2><div class="bar"><i style="width:${pct}%"></i></div>
  <div class="mut">Últimos 14 dias (toque para abrir o dia)</div><div class="strip">${strip}</div>`;
  if(ed){h+=`<p class="mut">Escreva sua rotina alimentar. O site organiza pelos horários do dia.</p>`+TYPES.filter(t=>d.meals.some(m=>m.type===t)).map(t=>`<div style="margin-bottom:10px"><b>${t}</b>${d.meals.filter(m=>m.type===t).map(m=>`<div style="display:flex;justify-content:space-between;align-items:center" class="mut"><span>• ${esc(m.text)}</span><button class="x" data-a="delm" data-id="${m.id}">✕</button></div>`).join('')}</div>`).join('')}
  else h+=meals.map(m=>`<button class="row ${log[m.id]?'on':''}" data-a="meal" data-id="${m.id}"><span class="ck">${log[m.id]?'✓':''}</span><span><small>${esc(m.type)}</small><b>${esc(m.text)}</b></span></button>`).join('');
  h+='</div>';
  if(ed)h+=`<div class="card"><h2>Adicionar refeição</h2><div class="f"><select id="m-type">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
  <div class="f"><input id="m-txt" placeholder="Ex.: pão com ovo" data-enter="addm"><button class="btn" id="addm" data-a="addm" style="flex:0 0 auto">Adicionar</button></div></div>`;
  if(meals.length)h+=`<button class="btn ghost" style="width:100%" data-a="editm">${EDIT?'Concluir edição':'Editar minha rotina alimentar'}</button>`;
  return h}

/* ---------- Treino ---------- */
function treino(){
  const d=cur(),w=d.workLog[D]||{},wo=d.workouts.find(x=>x.id===w.wid);
  const done=w.done||{},all=wo&&wo.ex.length&&wo.ex.every(e=>done[e.id]);
  const week=[...Array(7)].filter((_,i)=>(d.workLog[add(TODAY,-i)]||{}).trained).length;
  let h=dateNav()+`<div class="card"><h2>Treino do dia ${all&&w.trained?'<span class="badge ok">completo</span>':w.trained?'<span class="badge">treinou</span>':''}</h2>
  <select id="pickw" style="width:100%"><option value="">— sem treino / descanso —</option>${d.workouts.map(x=>`<option value="${x.id}" ${x.id===w.wid?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
  <button class="row trn ${w.trained?'on':''}" style="margin-top:10px" data-a="trained"><span class="ck">${w.trained?'✓':''}</span><span><b>Treinei hoje</b><small style="text-transform:none;letter-spacing:0">${w.trained?'toque de novo para desmarcar':'toque para marcar'}</small></span></button>`;
  if(wo){h+=wo.ex.map(e=>`<button class="row ${done[e.id]?'on':''}" data-a="ex" data-id="${e.id}"><span class="ck">${done[e.id]?'✓':''}</span><b>${esc(e.n)}</b></button>`).join('')||'<p class="mut">Esse treino ainda não tem exercícios.</p>';
    h+=`<button class="btn" style="width:100%" data-a="allex">Fiz todos os exercícios</button>`}
  h+=`<p class="mut">Treinos nos últimos 7 dias: <b>${week}</b></p></div>
  <div class="card"><h2>Meus treinos</h2>`+d.workouts.map(x=>`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between"><b>${esc(x.name)}</b><button class="x ${CONF==='w'+x.id?'cf':''}" data-a="delw" data-id="${x.id}" title="Remover treino">${CONF==='w'+x.id?'Apagar treino?':'✕'}</button></div>
   ${x.ex.map(e=>`<div style="display:flex;justify-content:space-between" class="mut"><span>• ${esc(e.n)}</span><button class="x" data-a="delex" data-w="${x.id}" data-id="${e.id}">✕</button></div>`).join('')}
   <div class="f"><input id="ex-${x.id}" placeholder="Novo exercício (ex.: Supino 4x10)" data-enter="add-${x.id}"><button class="btn ghost" id="add-${x.id}" data-a="addex" data-id="${x.id}" style="flex:0 0 auto">Adicionar</button></div></div>`).join('')+
  `<div class="f"><input id="nw" placeholder="Novo treino (ex.: Treino A – Peito)" data-enter="addw"><button class="btn" id="addw" data-a="addw" style="flex:0 0 auto">Criar treino</button></div></div>`;
  return h}

/* ---------- Peso & fotos ---------- */
function milestones(g,cu){
  if(!g.lose||!g.start)return[];const sg=g.mode==='gain'?1:-1,out=[],lost=sg*(cu-g.start);
  for(let f=g.lose;f>0;f-=g.step)out.push({f,lvl:g.start+sg*(g.lose-f),on:lost>=g.lose-f});
  out.push({f:0,lvl:g.start+sg*g.lose,on:lost>=g.lose});return out}
function spark(ws){if(ws.length<2)return'';const v=ws.map(w=>w.kg),mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
  const p=ws.map((w,i)=>`${(i/(ws.length-1)*296+2).toFixed(1)},${(56-(w.kg-mn)/r*50).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 300 60" width="100%" height="60" role="img" aria-label="Evolução do peso"><polyline points="${p}" fill="none" style="stroke:var(--acd)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
function peso(){
  const d=cur(),g=d.goal,ws=d.weights,last=ws[ws.length-1],cu=last?last.kg:g.start;
  const ph=ws.filter(w=>w.photo),lp=ph[ph.length-1],next=lp?add(lp.date,14):null;
  const days=Math.ceil((new Date(g.deadline+'T12:00')-new Date(TODAY+'T12:00'))/864e5);
  const gain=g.mode==='gain',lost=g.start&&cu?(gain?cu-g.start:g.start-cu):0,pct=g.lose?Math.max(0,Math.min(100,lost/g.lose*100)):0;
  const ms=milestones(g,cu);
  let h=`<div class="card"><h2>Meta até ${br(g.deadline)} <span class="badge">${days>0?days+' dias':'prazo encerrado'}</span></h2>
  <div class="f"><label class="mut">Peso inicial (kg)<input id="g-start" inputmode="decimal" value="${g.start||''}"></label><label class="mut">Objetivo<select id="g-mode" style="width:100%;margin-top:4px"><option value="lose" ${!gain?'selected':''}>Perder peso</option><option value="gain" ${gain?'selected':''}>Ganhar peso</option></select></label><label class="mut">Quanto ${gain?'ganhar':'perder'} (kg)<input id="g-lose" inputmode="decimal" value="${g.lose||''}"></label><label class="mut">Marco a cada (kg)<input id="g-step" inputmode="decimal" value="${g.step}"></label></div>
  <div class="f"><button class="btn" data-a="savegoal">Salvar meta</button></div>
  ${g.lose&&g.start?`<div class="bar"><i style="width:${pct}%"></i></div><div>${last?`Atual <b>${kg(cu)} kg</b> · `:''}${(lost>=0)===!gain?'perdeu':'ganhou'} <b>${kg(Math.abs(lost))} kg</b> · faltam <b>${kg(Math.max(g.lose-lost,0))} kg</b></div>`:'<p class="mut">Informe o peso inicial e a meta em kg. Você pode ajustar quando quiser.</p>'}
  ${spark(ws)}</div>`;
  if(ms.length)h+=`<div class="card"><h2>Marcadores</h2>${ms.map(m=>`<div class="ms ${m.on?'on':''}"><span>${m.on?'✓ ':''}Faltam ${kg(m.f)} kg</span><span>${kg(m.lvl)} kg</span></div>`).join('')}<p class="mut">Se o peso voltar, o marcador volta a ficar pendente.</p></div>`;
  const late=next&&next<=TODAY;
  h+=`<div class="card"><h2>Novo registro <span class="badge ${late||!next?'bad':''}">${!next?'sem foto ainda':late?'foto atrasada':'próxima foto: '+br(next)}</span></h2>
  <div class="f"><input type="date" id="w-date" value="${TODAY}"><input id="w-kg" inputmode="decimal" placeholder="Peso (kg)"></div>
  <div class="f"><input type="file" id="w-photo" accept="image/*"></div>
  <div class="f"><button class="btn" id="addwt" data-a="addwt">Salvar peso e foto</button></div><p class="mut">A foto do shape é a cada 2 semanas e fica junto do registro de peso.</p></div>
  <div class="card"><h2>Histórico</h2>`;
  h+=[...ws].reverse().map((w,i,a)=>{const pv=a[i+1],dl=pv?w.kg-pv.kg:null;
    return `<div class="rec">${w.photo?`<img src="${pu(w.photo)}" alt="foto ${br(w.date)}" data-a="zoom" data-src="${pu(w.photo)}">`:''}<div><b>${kg(w.kg)} kg</b><div class="mut">${br(w.date)}${dl!=null?` · ${dl>0?'+':''}${kg(dl)} kg`:''}</div></div><button class="x ${CONF==='r'+w.id?'cf':''}" data-a="delwt" data-id="${w.id}">${CONF==='r'+w.id?'Apagar?':'✕'}</button></div>`}).join('')||'<p class="mut">Nenhum registro ainda.</p>';
  return h+'</div>'}

/* ---------- render ---------- */
const SECS=[['alim','Alimentação',alim],['treino','Treino',treino],['peso','Peso & fotos',peso]];
const REV=new Set();let io=null,ioA=null;
function render(){
  const sy=scrollY,dr={};document.querySelectorAll('#w-date,#w-kg,#m-txt,#nw,[id^="ex-"],[id^="g-"]').forEach(i=>{if(RP===P)dr[i.id]=i.value});RP=P;
  const d=cur(),l=d.mealLog[TODAY]||{},mt=d.meals.length,mc=d.meals.filter(m=>l[m.id]).length,tr=(d.workLog[TODAY]||{}).trained;
  $('#root').innerHTML=`<div class="app p-${P}">
  <header class="hero"><div class="dd">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Olá, ${NAMES[P]}</h1><p>Sua rotina, tudo registrado.</p>
  <span class="pill">${mc}/${mt} refeições hoje</span><span class="pill">${tr?'Treino feito ✓':'Treino pendente'}</span></header>
  <div class="bar2"><div class="seg">${Object.keys(NAMES).map(k=>`<button class="${k===P?'on':''}" data-a="who" data-id="${k}">${NAMES[k]}</button>`).join('')}</div>
  <div class="chips">${SECS.map(s=>`<button data-a="jump" data-id="${s[0]}" data-chip="${s[0]}">${s[1]}</button>`).join('')}</div><div class="st" id="st">${LABEL[ST]}</div></div>
  
  ${msg?`<div class="warn">${esc(msg)}</div>`:''}
  ${SECS.map((s,i)=>`<section class="sec ${REV.has(s[0])?'in':''}" id="s-${s[0]}"><div class="sec-h"><span class="num">0${i+1}</span><div class="sec-t">${s[1]}</div></div><div class="sec-b">${s[2]()}</div></section>`).join('')}</div>`;
  Object.keys(dr).forEach(k=>{const el=document.getElementById(k);if(el&&dr[k])el.value=dr[k]});
  scrollTo(0,sy);observe();
}
function observe(){
  if(io)io.disconnect();if(ioA)ioA.disconnect();
  if(!('IntersectionObserver' in window)){document.querySelectorAll('.sec').forEach(el=>el.classList.add('in'));return}
  const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');REV.add(e.target.id.slice(2));io.unobserve(e.target)}}),{threshold:.08});
  document.querySelectorAll('.sec:not(.in)').forEach(el=>rm?el.classList.add('in'):io.observe(el));
  ioA=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('[data-chip]').forEach(c=>c.classList.toggle('on',c.dataset.chip===e.target.id.slice(2)))}),{rootMargin:'-35% 0px -60% 0px'});
  document.querySelectorAll('.sec').forEach(el=>ioA.observe(el));
  setTimeout(()=>document.querySelectorAll('.sec:not(.in)').forEach(el=>{const r=el.getBoundingClientRect();if(r.top<innerHeight&&r.bottom>0)el.classList.add('in')}),2500);
}

/* ---------- ações ---------- */
function wl(){const d=cur();return d.workLog[D]=d.workLog[D]||{}}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,d=cur();
  if(MUT.has(a)&&!READY)return toast('Conectando ao banco de dados… aguarde um instante e tente de novo.');
  if(a==='who'){P=id;msg='';EDIT=false;return render()}
  if(a==='jump'){const s=document.getElementById('s-'+id);if(s)s.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(a==='day'){D=add(D,+b.dataset.n);return render()}
  if(a==='today'){D=TODAY;return render()}
  if(a==='goto'){D=b.dataset.d;return render()}
  if(a==='zoom'){$('#lb img').src=b.dataset.src;return $('#lb').classList.add('on')}
  if(a==='unzoom')return $('#lb').classList.remove('on');
  if(a==='editm'){EDIT=!EDIT;return render()}
  if(a==='meal'){const l=d.mealLog[D]=d.mealLog[D]||{};l[id]=!l[id];return save()}
  if(a==='trained'){const w=wl();w.trained=!w.trained;return save()}
  if(a==='ex'){const w=wl();w.done=w.done||{};w.done[id]=!w.done[id];if(w.done[id])w.trained=true;return save()}
  if(a==='allex'){const w=wl(),wo=d.workouts.find(x=>x.id===w.wid);if(!wo)return;w.done={};wo.ex.forEach(x=>w.done[x.id]=true);w.trained=true;return save()}
  if(a==='addw'){const v=$('#nw').value.trim();if(!v)return;d.workouts.push({id:uid(),name:v,ex:[]});$('#nw').value='';return save()}
  if(a==='delw'){if(!ask('w'+id))return;d.workouts=d.workouts.filter(x=>x.id!==id);return save()}
  if(a==='addex'){const v=$('#ex-'+id).value.trim();if(!v)return;d.workouts.find(x=>x.id===id).ex.push({id:uid(),n:v});$('#ex-'+id).value='';return save()}
  if(a==='delex'){const w=d.workouts.find(x=>x.id===b.dataset.w);w.ex=w.ex.filter(x=>x.id!==id);return save()}
  if(a==='savegoal'){const g=d.goal,nn=s=>parseFloat(String($(s).value).replace(',','.'));const st=nn('#g-start'),lo=nn('#g-lose'),sp=nn('#g-step');
    g.mode=$('#g-mode').value==='gain'?'gain':'lose';g.start=st>0?st:null;g.lose=lo>0?lo:null;g.step=sp>0?Math.max(.5,sp):2;
    $('#g-start').value=g.start||'';$('#g-lose').value=g.lose||'';$('#g-step').value=g.step;toast('Meta salva ✓');return save()}
  if(a==='addm'){const v=$('#m-txt').value.trim();if(!v)return;d.meals.push({id:uid(),type:$('#m-type').value,text:v});$('#m-txt').value='';EDIT=true;return save()}
  if(a==='delm'){d.meals=d.meals.filter(x=>x.id!==id);return save()}
  if(a==='delwt'){if(!ask('r'+id))return;d.weights=d.weights.filter(x=>x.id!==id);return save()}
  if(a==='addwt'){
    const v=parseFloat($('#w-kg').value.replace(',','.')),dt=$('#w-date').value;
    if(!v||!dt)return toast('Informe a data e o peso.');
    const f=$('#w-photo').files[0];let photo=null;
    if(f){if(!assets)return toast('O envio de fotos não está disponível para você neste link.');
      b.disabled=true;b.textContent='Enviando…';
      try{photo=(await assets.upload(f)).id}catch(err){b.disabled=false;b.textContent='Salvar peso e foto';return toast('Falha ao enviar a foto: '+((err&&(err.message||err.code))||'tente novamente'))}}
    d.weights.push({id:uid(),date:dt,kg:v,photo});d.weights.sort((x,y)=>x.date<y.date?-1:1);
    if(!d.goal.start)d.goal.start=d.weights[0].kg;$('#w-kg').value='';return save()}
});
document.addEventListener('change',e=>{
  const i=e.target,d=cur(),n=s=>parseFloat(String(s).replace(',','.'))||null;
  if(!READY&&(i.id==='pickw'||/^g-/.test(i.id))){toast('Conectando ao banco de dados… tente de novo em instantes.');return render()}
  if(i.classList.contains('dt')&&i.value){D=i.value;render()}
  else if(i.id==='pickw'){wl().wid=i.value||null;save()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.enter){const b=document.getElementById(e.target.dataset.enter);b&&b.click()}});

/* ---------- init ---------- */
['bia','davi'].forEach(k=>{const l=lsGet(k);if(l)S[k]=Object.assign(blank(),l)});
render();
(async()=>{
  try{db=await claude.use('db');assets=await claude.use('assets')}catch(e){}
  if(!db){LOCAL=true;READY=true;shim();setSt('local');return render()}
  const t=setTimeout(()=>{if(READY)return;['bia','davi'].forEach(k=>{if(!LOADED[k])LOADED[k]=DENIED[k]=true});READY=true;setSt('denied');toast('Não consegui carregar os dados da nuvem. Os registros ficam só neste aparelho.');render()},6000);
  ['bia','davi'].forEach(k=>db.doc('people/'+k).onSnapshot(s=>{
    LOADED[k]=true;
    if(!FLY[k]&&!DENIED[k]&&s.exists){const r=Object.assign(blank(),s.data());if((r.t||0)>=(S[k].t||0)&&JSON.stringify(r)!==JSON.stringify(S[k])){S[k]=r;lsSet(k,r);dirty=true}}
    if(!READY&&LOADED.bia&&LOADED.davi){READY=true;clearTimeout(t);setSt('saved');dirty=true}
    if(!dirty)return;dirty=false;
    const ae=document.activeElement;if(ae&&/INPUT|SELECT/.test(ae.tagName)&&!ae.classList.contains('dt'))return;const fi=$('#w-photo');if(fi&&fi.files.length)return;render()},
   err=>{LOADED[k]=true;DENIED[k]=true;setSt('denied');toast('Erro ao ler a nuvem: '+((err&&(err.message||err.code))||''))}));
})();
</script></body></html>
